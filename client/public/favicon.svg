<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <!-- Neo-Brutalist Outer Container -->
  <rect x="4" y="4" width="56" height="56" rx="10" ry="10" fill="#0033FF" stroke="#0F172A" stroke-width="3" />
  
  <!-- Centered Bold White RB Lettering -->
  <text x="27" y="42" 
        text-anchor="middle" 
        fill="#FFFFFF" 
        font-family="system-ui, -apple-system, 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
        font-size="25" 
        font-weight="900" 
        letter-spacing="-1">RB</text>
        
  <!-- Top-Right #ACF847 Badge Accent with ₹ Symbol -->
  <rect x="41" y="4" width="19" height="19" rx="5" ry="5" fill="#ACF847" stroke="#0F172A" stroke-width="2.5" />
  <text x="50.5" y="18" 
        text-anchor="middle" 
        fill="#0F172A" 
        font-family="system-ui, -apple-system, 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
        font-size="13" 
        font-weight="900">₹</text>
</svg>
